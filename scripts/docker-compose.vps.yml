name: daoyou

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: daoyou
      POSTGRES_PASSWORD: daoyou-local-only
      POSTGRES_DB: daoyou_local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U daoyou -d daoyou_local']
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [daoyou-net]

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [daoyou-net]

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command:
      - --config=/etc/nats/nats-server.conf
      - --jetstream
      - --store_dir=/data/jetstream
      - --http_port=8222
      - --user=app
      - --pass=local-nats-password
    volumes:
      - nats-data:/data/jetstream
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8222/healthz | grep -q ok']
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [daoyou-net]

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    image: daoyou-app:local
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    stop_grace_period: 75s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health-check').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [daoyou-net]

  # 一次性迁移任务：docker compose -f scripts/docker-compose.vps.yml run --rm migrate
  # 首次部署必跑；每次升级代码后有新迁移时再跑一次。
  migrate:
    image: node:24.18.0-bookworm-slim
    working_dir: /app
    env_file:
      - ../.env.production
    volumes:
      - ..:/src:ro
    command: >
      sh -c "cp -r /src/. /app/
      && npm install --global pnpm@12.10.1 --registry=https://registry.npmmirror.com
      && pnpm install --frozen-lockfile --registry=https://registry.npmmirror.com
      && node node_modules/drizzle-kit/bin.cjs migrate --config drizzle.auth.config.ts
      && node node_modules/drizzle-kit/bin.cjs migrate"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [daoyou-net]

volumes:
  postgres-data:
  redis-data:
  nats-data:

networks:
  daoyou-net:
